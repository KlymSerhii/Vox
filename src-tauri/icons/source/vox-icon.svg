<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vox app icon — master source.
  Warm peach→coral squircle (#FFB088 → #FF7A5C) with a cream curly-quote
  glyph (#FFF4E8) whose tail extends into a speech-bubble pointer.
  Frames Vox as an authorship tool, not a recording tool.

  Renders at any size via the viewBox; the file ships at 1024×1024
  for direct rasterisation. To regenerate the .icns set:

    rsvg-convert -w 1024 -h 1024 vox-icon.svg -o vox-icon-1024.png
    npx @tauri-apps/cli icon ./vox-icon-1024.png

  At 16×16, hand-tune by dropping the speech-bubble tail subpath and
  thickening the glyph ~8% — antialiasing destroys the counter at that
  size if you simply downscale the master.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 48 48"
  role="img"
  aria-label="Vox"
>
  <defs>
    <linearGradient
      id="vox-bg"
      x1="0"
      y1="0"
      x2="48"
      y2="48"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFB088" />
      <stop offset="1" stop-color="#FF7A5C" />
    </linearGradient>
    <linearGradient
      id="vox-rim"
      x1="24"
      y1="0"
      x2="24"
      y2="24"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="vox-inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dy="3" />
      <feComposite
        in2="SourceAlpha"
        operator="arithmetic"
        k2="-1"
        k3="1"
        result="shadowDiff"
      />
      <feFlood flood-color="#A33616" flood-opacity="0.18" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Squircle background, full bleed. -->
  <path
    d="M24 0C10.7 0 0 10.7 0 24s10.7 24 24 24 24-10.7 24-24S37.3 0 24 0Z"
    fill="url(#vox-bg)"
    filter="url(#vox-inner)"
  />
  <!-- 1px highlight rim on the upper half (Liquid Glass cue). -->
  <path
    d="M24 0C10.7 0 0 10.7 0 24s10.7 24 24 24 24-10.7 24-24S37.3 0 24 0Z"
    fill="none"
    stroke="url(#vox-rim)"
    stroke-width="1"
  />

  <!-- Curly-quote glyph: left bowl + right bowl. -->
  <path
    d="M16.2 14.5c-3.4 1.5-5.5 4.5-5.5 8.2 0 2.8 1.6 4.7 4 4.7 2.3 0 3.9-1.6 3.9-3.7 0-1.8-1.1-3-2.7-3.3.2-1.7 1.4-3.3 3.3-4.4.7-.4.9-1.1.5-1.6-.4-.5-1.1-.5-1.9-.1Zm6.3-.5L17.7 33.4c-.2.8.3 1.5 1.2 1.5h2.1c.7 0 1.3-.4 1.4-1.1l4.2-19c.2-.7-.2-1.3-.9-1.3h-2.6c-.5 0-.9.2-1 .5Z"
    fill="#FFF4E8"
  />
  <!-- Speech-bubble tail. Drop this path for the 16×16 export. -->
  <path
    d="M19.1 31.6 15.3 36.7c-.4.5.1 1.2.7 1l5.2-1.8c.5-.2.6-.8.2-1.2l-1.4-3.3c-.3-.6-1.2-.6-1.5.2Z"
    fill="#FFF4E8"
  />
</svg>
