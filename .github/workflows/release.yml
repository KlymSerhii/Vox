# Release workflow for Vox.
#
# Triggers:
#   - On push of any tag matching `v*` (e.g. `v1.0.0`).
#   - Manually via "Run workflow" in the Actions tab (uses workflow_dispatch
#     for re-runs without re-tagging; the version is read from Cargo.toml).
#
# What it does on each run:
#   1. Imports the Developer ID Application certificate (from the
#      APPLE_CERTIFICATE secret) into a fresh per-job keychain.
#   2. Builds the macOS .app + .dmg + Tauri updater .tar.gz, all
#      signed with the Developer ID cert.
#   3. Submits the .app to Apple's notary service for notarization
#      (via APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID) and staples
#      the ticket.
#   4. Generates a `latest.json` updater manifest containing the
#      version, signature (from the .tar.gz.sig), and the GitHub
#      Releases download URL.
#   5. Creates a release on the public KlymSerhii/vox-releases repo
#      and uploads the .app.tar.gz + .sig + .dmg + latest.json.
#
# Secrets consumed (all configured under Settings → Secrets → Actions
# in the *private* KlymSerhii/Vox repo):
#   APPLE_ID                          - Apple ID email
#   APPLE_PASSWORD                    - app-specific password
#   APPLE_TEAM_ID                     - Apple Team ID (e.g. 4NUJDWKWX5)
#   APPLE_SIGNING_IDENTITY            - "Developer ID Application: Name (TEAM)"
#   APPLE_CERTIFICATE                 - base64 of the .p12 cert export
#   APPLE_CERTIFICATE_PASSWORD        - .p12 export password
#   KEYCHAIN_PASSWORD                 - random password for the temp keychain
#   RELEASES_TOKEN                    - fine-grained PAT for vox-releases
#   TAURI_SIGNING_PRIVATE_KEY         - contents of ~/.tauri/vox-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - password set when generating it
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-macos:
    name: Build & release (macOS Apple Silicon)
    # macos-latest currently maps to a runner with Xcode 16+; the
    # apple-fm bridge weak-links FoundationModels.framework which
    # requires the macOS 26 SDK (Xcode 17+). We select the newest
    # available Xcode in a step below.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history + tags so we can `git describe` the previous
          # release tag and diff commit messages between it and HEAD for
          # auto-generated release notes (see "Generate release notes" step).
          fetch-depth: 0

      - name: Diagnostics — runner OS & available Xcode versions
        run: |
          set -eu
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Default Xcode:"
          xcodebuild -version || true
          echo
          echo "All installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo
          echo "Checking for FoundationModels.framework in the active SDK:"
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)
          echo "SDK path: $SDK_PATH"
          if [ -n "$SDK_PATH" ] && [ -d "$SDK_PATH/System/Library/Frameworks/FoundationModels.framework" ]; then
            echo "FoundationModels FOUND in active SDK."
          else
            echo "FoundationModels NOT in active SDK — will try alternate Xcode versions."
          fi

      - name: Select newest available Xcode (needs macOS 26 SDK for FoundationModels)
        run: |
          set -eu
          # Walk installed Xcodes newest-first, pick the first one whose
          # SDK contains FoundationModels.framework. If none has it, fall
          # back to the newest Xcode anyway and let the build fail loudly
          # with a clear diagnostic.
          chosen=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            sdk="$app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
            if [ -d "$sdk/System/Library/Frameworks/FoundationModels.framework" ]; then
              chosen="$app"
              echo "Found FoundationModels SDK in: $app"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            # No Xcode on the runner has the macOS 26 SDK. Fall back to
            # whatever is newest and let the build surface a clear error.
            chosen=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr | head -1)
            echo "::warning::No Xcode on this runner has FoundationModels.framework. Selected newest ($chosen) but the apple-fm bridge link step will fail. If this is sustained, switch CI to a self-hosted runner or build with --no-default-features --features local-engines,parakeet."
          fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          echo "Selected Xcode:"
          xcodebuild -version
          echo "Active SDK path: $(xcrun --sdk macosx --show-sdk-path)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve version
        id: vars
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from commit log
        id: notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          # Find the previous v* tag so we can diff commit messages.
          # Tag pushes (refs/tags/v*) sit ON the new tag, so we walk
          # back from HEAD's parent to skip it. Manual workflow_dispatch
          # runs on a branch, so the latest tag IS the previous release.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match='v*' HEAD^ 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || true)
          fi

          NOTES_BODY="$RUNNER_TEMP/release-body.md"
          NOTES_PLAIN="$RUNNER_TEMP/release-notes.txt"

          if [ -n "$PREV_TAG" ]; then
            echo "Diffing $PREV_TAG..HEAD"
            # `--no-merges` drops PR merge commits. `--reverse` puts
            # oldest-first so the chronology matches what users expect.
            COMMITS=$(git log "$PREV_TAG"..HEAD --no-merges --reverse --pretty=format:'- %s')
            if [ -z "$COMMITS" ]; then
              COMMITS="- No user-visible changes since ${PREV_TAG}."
            fi
            HEADING="## What's new since ${PREV_TAG}"
          else
            echo "No previous tag — first release"
            COMMITS="- Initial release."
            HEADING="## What's new"
          fi

          # Plain bullet list — used as-is for `latest.json` so the
          # in-app installer can render it next to the Install button.
          printf '%s\n' "$COMMITS" > "$NOTES_PLAIN"

          # Full GitHub release body: changelog on top, then the install
          # + license boilerplate that used to be hardcoded in the
          # `gh release create --notes` invocation.
          {
            echo "${HEADING}"
            echo
            echo "$COMMITS"
            echo
            echo "## Install"
            echo "1. Download \`Vox.dmg\`."
            echo "2. Open the DMG and drag Vox into Applications."
            echo "3. Launch from Applications. macOS will verify the signature & notarization on first launch — no \"unknown developer\" warning."
            echo
            echo "## Auto-update"
            echo "The auto-updater fetches \`latest.json\` from this release. Existing v${VERSION}+ users will receive future updates automatically."
            echo
            echo "## License"
            echo "Free for personal use. Commercial use requires a paid license — contact \`vox@rizenhq.com\`. See [LICENSE](https://github.com/KlymSerhii/vox-releases/blob/main/LICENSE)."
          } > "$NOTES_BODY"

          echo "--- release notes (plain) ---"
          cat "$NOTES_PLAIN"
          echo "--- release body (markdown) ---"
          cat "$NOTES_BODY"

          echo "notes_plain=$NOTES_PLAIN" >> "$GITHUB_OUTPUT"
          echo "notes_body=$NOTES_BODY" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode the base64 .p12 to a temp file
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Create a fresh keychain for this job and make it the default
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Import the cert + private key, granting codesign access
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          # Authorize codesign to use the imported key without prompts
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Verify the identity is now visible to codesign
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Wipe the .p12 from disk
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install npm dependencies
        run: npm ci

      - name: Build, sign, and notarize Vox
        env:
          # Apple notary credentials. Tauri's bundler picks these up
          # automatically when present and submits the .app to notary
          # via xcrun notarytool, then staples the ticket.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri updater signing key (signs the .app.tar.gz so the
          # auto-updater can verify against the embedded pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Pin the deployment target across every sub-build (cargo cc,
          # swiftc, cargo link, tauri bundle). Mismatched targets between
          # Swift bridges (built at 14.0), whisper-rs's Obj-C ggml-metal
          # (built with host default), and the final link step produce
          # `___isPlatformVersionAtLeast` undefined-symbol errors.
          # 14.0 is the floor required by FluidAudio (Parakeet bridge);
          # Apple Intelligence still requires macOS 26 at runtime.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          # `--bundles app dmg` selects the macOS .app + .dmg targets.
          # The updater .tar.gz + .sig is generated automatically because
          # `bundle.createUpdaterArtifacts: true` is set in tauri.conf.json.
          npm run tauri build -- \
            --target aarch64-apple-darwin \
            --bundles app dmg \
            --verbose

      - name: Stage release artifacts
        id: stage
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          NOTES_PLAIN: ${{ steps.notes.outputs.notes_plain }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          STAGE="$RUNNER_TEMP/release-staging"
          mkdir -p "$STAGE"

          # Tauri names the .app bundle dir "<productName>.app", and the
          # DMG follows "<productName>_<version>_<arch>.dmg". The updater
          # tarball + signature live next to the .app.
          APP_TARGZ="$BUNDLE_DIR/macos/Vox.app.tar.gz"
          APP_SIG="$BUNDLE_DIR/macos/Vox.app.tar.gz.sig"
          DMG="$BUNDLE_DIR/dmg/Vox_${VERSION}_aarch64.dmg"

          # Sanity check: fail loudly if any expected artifact is missing.
          for f in "$APP_TARGZ" "$APP_SIG" "$DMG"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected artifact: $f"
              echo "Bundle dir contents:"
              ls -la "$BUNDLE_DIR/macos" "$BUNDLE_DIR/dmg" || true
              exit 1
            fi
          done

          # Use stable, version-agnostic filenames so the marketing site
          # can link to `/releases/latest/download/Vox.dmg` and have it
          # auto-resolve to the newest release. The release tag (v1.0.x)
          # still encodes the version on the GitHub release page.
          cp "$APP_TARGZ" "$STAGE/Vox.app.tar.gz"
          cp "$APP_SIG"   "$STAGE/Vox.app.tar.gz.sig"
          cp "$DMG"       "$STAGE/Vox.dmg"

          # Generate the Tauri updater manifest. The signature is the
          # contents of the .sig file (a single-line minisign signature
          # the updater verifies against tauri.conf.json's pubkey).
          # `jq -Rs` slurps the notes file as one raw string so embedded
          # newlines and quotes are JSON-escaped automatically — using
          # heredoc + interpolation here would break the moment a commit
          # subject contained a `"` or `\`.
          SIGNATURE=$(cat "$APP_SIG")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/KlymSerhii/vox-releases/releases/download/v${VERSION}/Vox.app.tar.gz"

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg sig "$SIGNATURE" \
            --arg url "$URL" \
            --rawfile notes "$NOTES_PLAIN" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $sig, url: $url }
              }
            }' > "$STAGE/latest.json"

          echo "--- latest.json ---"
          cat "$STAGE/latest.json"
          echo "-------------------"

          ls -la "$STAGE"
          echo "stage_dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Verify Gatekeeper acceptance of signed .app
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Vox.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type exec --verbose=4 "$APP_PATH"

      - name: Publish release to KlymSerhii/vox-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          STAGE: ${{ steps.stage.outputs.stage_dir }}
          NOTES_BODY: ${{ steps.notes.outputs.notes_body }}
        run: |
          set -euo pipefail
          # If the release already exists (e.g. a manual dispatch retry),
          # delete it so we start clean. `gh release delete` is a no-op
          # if the release doesn't exist.
          gh release delete "v${VERSION}" \
            --repo KlymSerhii/vox-releases \
            --yes || true

          # `--notes-file` reads the markdown body assembled in the
          # "Generate release notes" step (changelog + install/license
          # boilerplate). Avoids re-escaping the same content inline and
          # keeps the source of truth in one place.
          gh release create "v${VERSION}" \
            --repo KlymSerhii/vox-releases \
            --title "Vox ${VERSION}" \
            --notes-file "$NOTES_BODY" \
            "$STAGE/Vox.app.tar.gz" \
            "$STAGE/Vox.app.tar.gz.sig" \
            "$STAGE/Vox.dmg" \
            "$STAGE/latest.json"

          echo "Released v${VERSION} to https://github.com/KlymSerhii/vox-releases/releases/tag/v${VERSION}"
