<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Vox</title>
    <script>
      document.documentElement.dataset.theme = (() => { const v = localStorage.getItem('vox-theme'); return v === 'light' || v === 'dark' ? v : 'dark'; })();
    </script>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/entries/tray-popover.tsx"></script>
  </body>
</html>
